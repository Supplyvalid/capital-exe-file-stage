name: Upload Release to S3 - Stage

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  upload-release:
    runs-on: ubuntu-latest

    steps:
      - name: Download Shelivo EXE from Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p release

          gh release download "$TAG_NAME" \
            --pattern "Shelivo-Setup.exe" \
            --dir release \
            --repo "${{ github.repository }}"

          echo "Downloaded files:"
          ls -lh release/

      - name: Verify EXE
        run: |
          if [ ! -f "release/Shelivo-Setup.exe" ]; then
            echo "ERROR: Shelivo-Setup.exe not found!"
            exit 1
          fi

          echo "EXE found successfully."
          ls -lh release/Shelivo-Setup.exe

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload EXE to S3 Stage
        run: |
          aws s3 cp \
            release/Shelivo-Setup.exe \
            s3://shelivo/stage/Shelivo-Setup.exe \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/octet-stream"

      - name: Upload latest.yml to S3 Stage
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "latest.yml" \
            --dir release \
            --repo "${{ github.repository }}"

          aws s3 cp \
            release/latest.yml \
            s3://shelivo/stage/latest.yml \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/yaml"

      - name: Deployment successful
        run: |
          echo "======================================"
          echo "Stage Deployment Successful"
          echo "======================================"
          echo ""
          echo "Release: ${{ github.event.release.tag_name }}"
          echo ""
          echo "S3 EXE:"
          echo "s3://shelivo/stage/Shelivo-Setup.exe"
          echo ""
          echo "S3 latest.yml:"
          echo "s3://shelivo/stage/latest.yml"
